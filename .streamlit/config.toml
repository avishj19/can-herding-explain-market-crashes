# Two color sets for the web app (app.py). Visitors switch with the button at the top right
# (web/common.py); a first-time visitor gets their device's light or dark setting. Controls are
# gray in both, so color on a page always means data (web/common.py lists what each color means).
[theme]
showWidgetBorder = true
baseRadius = "6px"

[theme.dark]
primaryColor = "#C7CDD8"
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#11151C"
textColor = "#E6E8EE"
borderColor = "#1F2632"

[theme.light]
primaryColor = "#374151"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
borderColor = "#E5E7EB"

[server]
headless = true

[browser]
gatherUsageStats = false
